name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Core tests — pure Python, no Django dependency
  # ===========================================================================
  core-tests:
    name: Core Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-core-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-core-${{ matrix.python-version }}-

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[core,dev]"

      - name: Run core tests
        run: |
          pytest tests/core/ -p no:django --no-cov -q

      - name: Run core tests with coverage (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          pytest tests/core/ -p no:django -o "addopts=" --cov=tenxyte.core --cov-report=xml:coverage-core.xml --cov-report=term --cov-fail-under=90 -q

      - name: Upload core coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core
          path: coverage-core.xml

  # ===========================================================================
  # Django integration tests — requires Django ORM
  # ===========================================================================
  django-tests:
    name: Django Tests (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.2", "5.0", "5.1", "5.2", "6.0"]
        exclude:
          # Django 4.2 does not support Python 3.13
          - python-version: "3.13"
            django-version: "4.2"
          # Django 6.0 requires Python >= 3.12
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.0"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-django-${{ matrix.python-version }}-${{ matrix.django-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-django-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[django,dev]"
          pip install "django==${{ matrix.django-version }}.*"

      - name: Run Django integration tests
        run: |
          pytest tests/integration/django/ --no-cov -q

      - name: Run tests with coverage (Python 3.12, Django 6.0 only)
        if: matrix.python-version == '3.12' && matrix.django-version == '6.0'
        run: |
          pytest tests/integration/django/ -o "addopts=" --cov=tenxyte --cov-report=xml:coverage-django.xml --cov-report=term -q

      - name: Upload Django coverage
        if: matrix.python-version == '3.12' && matrix.django-version == '6.0'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-django
          path: coverage-django.xml

  # ===========================================================================
  # Install matrix — verifies the 1.0 packaging inversion (Requirement 2) in clean venvs:
  # Core-only default install, opt-in [django] extra, deprecated [core] no-op alias, and extra
  # combination. See specs/z_aud_1 design.md "Correctness Properties" / manual_tests.md MT-1.
  # ===========================================================================
  install-matrix:
    name: Install Matrix (tenxyte${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: ["", "[django]", "[core]", "[django,webauthn]"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install in a clean venv (tenxyte${{ matrix.target }})
        run: |
          python -m venv /tmp/install-matrix-venv
          source /tmp/install-matrix-venv/bin/activate
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir /tmp/dist .
          pip install "$(ls /tmp/dist/*.whl)${{ matrix.target }}"

      - name: Smoke test — import and version
        run: |
          source /tmp/install-matrix-venv/bin/activate
          python -c "import tenxyte; print('tenxyte version:', tenxyte.__version__)"

      - name: Smoke test — Core-only targets have no Django and Core is usable
        if: matrix.target == '' || matrix.target == '[core]'
        run: |
          source /tmp/install-matrix-venv/bin/activate
          python -c "
          import sys
          try:
              import django
              sys.exit('FAIL: django should NOT be installed for target \"${{ matrix.target }}\"')
          except ImportError:
              pass
          from tenxyte.core.jwt_service import JWTService
          from tenxyte.core.totp_service import TOTPService
          print('Core-only smoke OK: no Django, Core services importable')
          "
          python -c "
          import tenxyte
          try:
              tenxyte.setup({})
              exit('FAIL: setup() should have raised TenxyteMissingDependencyError')
          except tenxyte.TenxyteMissingDependencyError as e:
              assert 'pip install tenxyte[django]' in str(e), e
              print('Import_Guard smoke OK:', e)
          "

      - name: Smoke test — Django-stack targets have Django and the full stack
        if: matrix.target == '[django]' || matrix.target == '[django,webauthn]'
        run: |
          source /tmp/install-matrix-venv/bin/activate
          python -c "
          import django, rest_framework, corsheaders, drf_spectacular, google.auth
          import tenxyte
          assert callable(tenxyte.setup)
          assert tenxyte.AbstractUser is not None
          print('Django-stack smoke OK: full stack + Import_Guard transparency')
          "

      - name: Smoke test — webauthn extra present
        if: matrix.target == '[django,webauthn]'
        run: |
          source /tmp/install-matrix-venv/bin/activate
          python -c "import webauthn; print('webauthn extra OK')"

  # ===========================================================================
  # Upload combined coverage to Codecov
  # ===========================================================================
  coverage:
    name: Upload Coverage
    runs-on: ubuntu-latest
    needs: [core-tests, django-tests]
    if: always()

    steps:
      - uses: actions/checkout@v7

      - name: Download core coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-core
          path: coverage/
        continue-on-error: true

      - name: Download Django coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-django
          path: coverage/
        continue-on-error: true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: coverage/
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ===========================================================================
  # Lint
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.7 black==26.5.1

      - name: Run ruff
        run: ruff check src/tenxyte/

      - name: Check black formatting
        run: black --check src/tenxyte/
