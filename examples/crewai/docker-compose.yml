services:
  tenxyte:
    build:
      context: ../..
      dockerfile: examples/crewai/Dockerfile.tenxyte
    ports:
      - "8000:8000"
    command: ["python", "-m", "spec.airs.conformance.tenxyte_ci.seed_and_serve", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/auth/ai/.well-known/airs/')"]
      interval: 2s
      timeout: 3s
      retries: 20

  crew:
    build:
      context: ../..
      dockerfile: examples/crewai/Dockerfile.crew
    depends_on:
      tenxyte:
        condition: service_healthy
    environment:
      TENXYTE_BASE_URL: "http://tenxyte:8000/api/v1/auth"
      CREWAI_DEMO_AUTO_CONFIRM: "1"
      USE_REAL_LLM: "0"
