services:
  tenxyte:
    build:
      context: ../..
      dockerfile: examples/js-contract-backend/Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/')"]
      interval: 2s
      timeout: 3s
      retries: 20
