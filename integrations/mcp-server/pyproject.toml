[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenxyte-mcp-server"
version = "0.1.0"
description = "MCP server exposing AIRS/1.0 Agent Token upkeep (status, heartbeat, usage reporting, pending actions) as tools for MCP clients such as Claude Desktop. Pure HTTP client, no dependency on the tenxyte package."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Tenxyte" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "airs", "agent-identity", "claude-desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
tenxyte-mcp-server = "tenxyte_mcp_server.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "hypothesis>=6.0",
    "ruff==0.16.7",
    "black==26.5.1",
]

[project.urls]
Homepage = "https://github.com/tenxyte/tenxyte"
Specification = "https://github.com/tenxyte/tenxyte/blob/main/spec/airs/AIRS-1.0.md"
Documentation = "https://github.com/tenxyte/tenxyte/tree/main/integrations/mcp-server"

[tool.hatch.build.targets.wheel]
packages = ["src/tenxyte_mcp_server"]

[tool.ruff]
line-length = 120
extend-exclude = ["tests"]

[tool.black]
line-length = 120
