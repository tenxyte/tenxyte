name: Publish AIRS Integrations to PyPI

on:
  push:
    tags:
      - "langchain-v*"
      - "mcp-server-v*"

permissions:
  contents: read

jobs:
  # ===========================================================================
  # tenxyte-langchain
  # ===========================================================================
  test-langchain:
    name: Test tenxyte-langchain before publish
    if: startsWith(github.ref, 'refs/tags/langchain-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: integrations/langchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: integrations/langchain
        run: pytest tests/

  publish-langchain:
    name: Build and publish tenxyte-langchain to PyPI
    if: startsWith(github.ref, 'refs/tags/langchain-v')
    runs-on: ubuntu-latest
    needs: [test-langchain]
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install hatch build

      - name: Build package
        working-directory: integrations/langchain
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/langchain/dist/
          attestations: true

  # ===========================================================================
  # tenxyte-mcp-server
  # ===========================================================================
  test-mcp-server:
    name: Test tenxyte-mcp-server before publish
    if: startsWith(github.ref, 'refs/tags/mcp-server-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: integrations/mcp-server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: integrations/mcp-server
        run: pytest tests/

  publish-mcp-server:
    name: Build and publish tenxyte-mcp-server to PyPI
    if: startsWith(github.ref, 'refs/tags/mcp-server-v')
    runs-on: ubuntu-latest
    needs: [test-mcp-server]
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install hatch build

      - name: Build package
        working-directory: integrations/mcp-server
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/mcp-server/dist/
          attestations: true
