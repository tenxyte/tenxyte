reason = "Django declares ['200', '400', '401']; FastAPI declares ['200', '422']. FastAPI's auto-schema only documents its own native 422 validation response (rewritten to 400 at runtime, see errors.py) plus each route's success code — TenxyteAPIError-raised error paths aren't declared via a route-level responses={} kwarg yet."

